<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voice Changer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.15);
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  p {
    font-size: 13px;
    color: #9ca3af;
  }
  #status {
    margin-top: 16px;
    font-size: 12px;
    color: #6b7280;
    max-width: 480px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Voice Changer</h1>
  <p>Starting backend server…</p>
  <div id="status">This may take a while on first launch as model weights are being downloaded.</div>
</body>
</html>
